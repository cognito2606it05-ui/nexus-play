# Nginx Reverse Proxy Config for NEXUS Play VPS
# Save to: /etc/nginx/sites-available/nexusplay
# Symlink: sudo ln -s /etc/nginx/sites-available/nexusplay /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _; # Or replace with your domain e.g. nexusplay.yourdomain.com

    client_max_body_size 500M; # Support live stream recording uploads & video files

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:9001/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # WebSockets / SSE Event stream support
    location /api/events {
        proxy_pass http://127.0.0.1:9001/api/events;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Cache-Control 'no-cache';
        proxy_buffering off;
        chunked_transfer_encoding off;
    }
}
